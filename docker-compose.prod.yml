# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Or standalone (no dev compose):
#   docker compose -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: axway-aiops:latest
    ports:
      - "8000:8000"
    env_file:
      - .env.prod          # create from .env.example — never commit this file
    environment:
      - DATABASE_URL=sqlite:///./data/axway_aiops.db
      - MOCK_AXWAY=false   # real Axway API in production
    volumes:
      # DB only — no source mount in prod
      - axway_data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  axway_data:
    driver: local
